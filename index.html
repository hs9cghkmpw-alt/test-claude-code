<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>高校勉強アプリ</title>
<meta name="theme-color" content="#4f46e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="高校勉強">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ホーム画面 -->
  <section id="screen-home" class="screen">
    <header class="topbar">
      <h1>高校勉強アプリ</h1>
      <button id="btn-stats" class="icon-btn" aria-label="統計">📊</button>
    </header>

    <div class="weak-card" id="weak-card">
      <div class="weak-card-main">
        <div class="weak-card-title">苦手分野の復習</div>
        <div class="weak-card-sub" id="weak-card-sub">今日の復習: 0問</div>
      </div>
      <button id="btn-weak-review" class="btn btn-accent">復習する</button>
    </div>

    <div class="subject-grid" id="subject-grid"></div>

    <p class="hint">※ サンプル問題で動作するミニアプリです。ホーム画面に追加するとオフラインでも使えます。</p>
  </section>

  <!-- クイズ画面 -->
  <section id="screen-quiz" class="screen hidden">
    <header class="topbar">
      <button id="btn-quiz-back" class="icon-btn" aria-label="戻る">←</button>
      <h1 id="quiz-title">科目名</h1>
      <span id="quiz-progress" class="progress-label">1/10</span>
    </header>

    <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>

    <div class="quiz-card">
      <div class="quiz-category" id="quiz-category">カテゴリ</div>
      <div class="quiz-question" id="quiz-question">問題文がここに入ります</div>
      <div class="choices" id="quiz-choices"></div>
      <div class="explanation hidden" id="quiz-explanation"></div>
    </div>

    <div class="quiz-footer">
      <button id="btn-next" class="btn btn-primary hidden">次へ</button>
    </div>
  </section>

  <!-- 結果画面 -->
  <section id="screen-result" class="screen hidden">
    <header class="topbar">
      <h1>結果</h1>
    </header>
    <div class="result-card">
      <div class="result-score" id="result-score">8 / 10</div>
      <div class="result-message" id="result-message">よくできました!</div>
    </div>
    <div class="result-actions">
      <button id="btn-result-retry" class="btn btn-primary">もう一度</button>
      <button id="btn-result-home" class="btn btn-secondary">ホームに戻る</button>
    </div>
  </section>

  <!-- 統計画面 -->
  <section id="screen-stats" class="screen hidden">
    <header class="topbar">
      <button id="btn-stats-back" class="icon-btn" aria-label="戻る">←</button>
      <h1>学習の記録</h1>
    </header>
    <div id="stats-body" class="stats-body"></div>
    <div class="result-actions">
      <button id="btn-reset-progress" class="btn btn-danger">記録をリセット</button>
    </div>
  </section>

</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
